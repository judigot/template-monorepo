name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  checks:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-bun1.3.14-${{ hashFiles('bun.lock', 'turbo.json') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-bun1.3.14-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: bun run test:e2e
        env:
          CI: true

  api-node-runtime:
    name: API on Node.js LTS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Serve the API with Node.js and verify /api/hello
        working-directory: apps/api
        run: |
          node src/index.ts &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/hello > /tmp/hello.json; then
              break
            fi
            sleep 0.5
          done
          cat /tmp/hello.json
          node -e "const fs = require('node:fs'); const body = JSON.parse(fs.readFileSync('/tmp/hello.json', 'utf8')); if (body.message !== 'Hello, world!') { throw new Error('Unexpected response: ' + JSON.stringify(body)); }"
          curl -fsS http://localhost:3000/api/health > /tmp/health.json
          node -e "const fs = require('node:fs'); const body = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8')); if (body.status !== 'healthy') { throw new Error('Unexpected health: ' + JSON.stringify(body)); }"
          kill "$SERVER_PID"
