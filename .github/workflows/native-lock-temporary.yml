name: Temporary Native Dependency Lockfile

on:
  push:
    branches:
      - app/travel-app

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Resolve pinned dependencies
        run: bun install
      - name: Export public lockfile for PR commit
        run: |
          echo NATIVE_LOCK_BEGIN
          base64 --wrap=76 bun.lock
          echo NATIVE_LOCK_END
