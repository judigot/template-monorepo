name: Travel Auth Lockfile Resolver (temporary)

on:
  push:
    branches:
      - app/travel-app

permissions:
  contents: read

jobs:
  resolve:
    if: github.event.head_commit.message == 'feat(travel): add Google OAuth foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install and update lockfile
        run: bun install
      - name: Export reproducible lockfile
        run: |
          printf 'AUTH_LOCK_BEGIN\n'
          base64 --wrap=76 bun.lock
          printf 'AUTH_LOCK_END\n'
