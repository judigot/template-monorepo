name: Travel formatter bootstrap

on:
  push:
    branches:
      - app/travel-app

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Format only the new travel app
        run: bunx biome check --linter-enabled=false --write apps/travel package.json
      - name: Print the changed files for the next commit
        run: |
          node -e 'const fs = require("node:fs"); const cp = require("node:child_process"); const files = cp.execFileSync("git", ["diff", "--name-only"], { encoding: "utf8" }).trim().split("\n").filter(Boolean); for (const name of files) { const base64 = fs.readFileSync(name).toString("base64"); console.log("FORMAT_FILE_BEGIN " + Buffer.from(name).toString("base64")); for (let i = 0; i < base64.length; i += 1800) { console.log("FORMAT_CHUNK " + base64.slice(i, i + 1800)); } console.log("FORMAT_FILE_END"); }'
